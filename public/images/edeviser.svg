<g id="pale"><path d="M-130 0L0-65L130 0V22L0 87L-130 22Z" fill="#C3C9B7"/><path d="M0 65L130 0V22L0 87Z" fill="#ADB9A5"/><path d="M-130 0L0-65L130 0L0 65Z" fill="#E7E8D9" stroke="#FCFBF2"/></g>
