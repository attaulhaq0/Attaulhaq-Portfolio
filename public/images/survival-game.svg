<title id="title">Survival — three worlds, one wilderness</title><desc id="desc">Original geometric wilderness artwork. Glacial blue-gray peaks, a mint-toned alpine forest and warm amber desert cliffs meet around a winding river. Fine atmospheric mist separates layered faceted mountains.</desc>
