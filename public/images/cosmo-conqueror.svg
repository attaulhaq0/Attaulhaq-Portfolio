<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Cosmo Conqueror — beyond the last horizon</title><desc id="desc">Original cinematic science-fiction landscape in amber and charcoal. A colossal tilted orbital ring eclipses a distant planet above angular alien ridges, while a small faceted exploratory craft crosses the light.</desc>
<defs>
<linearGradient id="sky" x1="600" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#10191E"/><stop offset=".6" stop-color="#2F3432"/><stop offset="1" stop-color="#A78958"/></linearGradient>
<radialGradient id="planet" cx=".26" cy=".26" r=".8"><stop stop-color="#DCC494"/><stop offset=".34" stop-color="#A48F6D"/><stop offset=".7" stop-color="#51544A"/><stop offset="1" stop-color="#222D2C"/></radialGradient>
<linearGradient id="metal" x1="400" y1="100" x2="900" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#F2D69B"/><stop offset=".2" stop-color="#B9945A"/><stop offset=".47" stop-color="#404B49"/><stop offset=".7" stop-color="#263439"/><stop offset="1" stop-color="#BE995B"/></linearGradient>
<linearGradient id="haze" x1="0" y1="400" x2="0" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#D1AC72" stop-opacity="0"/><stop offset="1" stop-color="#D1AC72" stop-opacity=".44"/></linearGradient>
<linearGradient id="trail" x1="316" y1="0" x2="589" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#88D6C4" stop-opacity="0"/><stop offset="1" stop-color="#C5F4D7"/></linearGradient>
<clipPath id="disc"><circle cx="692" cy="326" r="185"/></clipPath>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
