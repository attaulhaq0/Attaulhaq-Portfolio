<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Family OS — a shared center of gravity</title><desc id="desc">Original pale olive architectural illustration. A sculptural household sits at the heart of orbital pathways linking a garden, a resource cylinder, folded paper and stacked objects, expressing connected everyday life.</desc>
<defs>
<radialGradient id="paper"><stop stop-color="#F5F3E6"/><stop offset="1" stop-color="#E5E5D5"/></radialGradient>
<linearGradient id="roof" x1="471" y1="250" x2="707" y2="395" gradientUnits="userSpaceOnUse"><stop stop-color="#638675"/><stop offset="1" stop-color="#34584E"/></linearGradient>
<linearGradient id="wall" x1="481" y1="350" x2="602" y2="535" gradientUnits="userSpaceOnUse"><stop stop-color="#E8E9D4"/><stop offset="1" stop-color="#B4C4A8"/></linearGradient>
<linearGradient id="cylinder"><stop stop-color="#547765"/><stop offset=".5" stop-color="#8DAB8A"/><stop offset="1" stop-color="#436354"/></linearGradient>
<filter id="shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#7C927D" opacity=".17"/></pattern>
<g id="platform"><ellipse cy="13" rx="90" ry="45" fill="#9FAF94"/><path d="M-90 0V13M90 0V13" stroke="#9FAF94" stroke-width="2"/><ellipse rx="90" ry="45" fill="#E8EAD7" stroke="#FDFCF0"/><ellipse rx="77" ry="38" stroke="#B4C2A7"/></g>
</defs>
