<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">E Deviser — a landscape of learning</title><desc id="desc">Original architectural illustration of connected isometric learning tiles in pale mint, rich teal and warm paper. An open book, stepped pathways and a raised knowledge pavilion form a dimensional learning landscape.</desc>
<defs>
<linearGradient id="mint" x1="0" y1="0" x2="160" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#C9E8D8"/><stop offset="1" stop-color="#88D6C4"/></linearGradient>
<linearGradient id="teal" x1="0" y1="-50" x2="0" y2="200" gradientUnits="userSpaceOnUse"><stop stop-color="#447B73"/><stop offset="1" stop-color="#203D3E"/></linearGradient>
<pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 0L80 40M80 0L0 40" stroke="#567268" stroke-opacity=".075"/></pattern>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="230%"><feGaussianBlur stdDeviation="17"/></filter>
