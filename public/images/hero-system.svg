<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" fill="none" role="img" aria-labelledby="title desc">
<title id="title">An architecture of connected intelligence</title><desc id="desc">An original exploded isometric computational assembly. Three translucent graphite plates float on precision steel rods around a luminous faceted mint core, with etched circuits, optical grids and polished edges.</desc>
<defs>
 <linearGradient id="plate" x1="220" y1="180" x2="900" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#3A5159" stop-opacity=".5"/><stop offset=".52" stop-color="#192328" stop-opacity=".8"/><stop offset="1" stop-color="#88D6C4" stop-opacity=".15"/></linearGradient>
 <linearGradient id="edge" x1="150" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#455C63"/><stop offset=".46" stop-color="#8AADB0"/><stop offset=".49" stop-color="#26373E"/><stop offset="1" stop-color="#4B6C71"/></linearGradient>
 <linearGradient id="coreTop" x1="420" y1="420" x2="790" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#E2FFF2"/><stop offset=".45" stop-color="#88D6C4"/><stop offset="1" stop-color="#55A792"/></linearGradient>
 <linearGradient id="coreLeft" x1="420" y1="500" x2="600" y2="730" gradientUnits="userSpaceOnUse"><stop stop-color="#6CBCAB"/><stop offset="1" stop-color="#2E736C"/></linearGradient>
